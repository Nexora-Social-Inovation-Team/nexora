<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Nexora ayarları</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        max-width: 32rem;
        margin: 0 auto;
        padding: 1.5rem;
        background: #ffffff;
        color: #14181f;
        font: 1rem/1.5 system-ui, sans-serif;
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #3b4451;
        border-radius: 0.375rem;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #0b46c0;
        outline-offset: 2px;
      }
      .hint {
        margin: 0.25rem 0 0;
        color: #3b4451;
        font-size: 0.875rem;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.5rem 1rem;
        border: 1px solid #1b4965;
        border-radius: 0.375rem;
        background: #1b4965;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      #status[data-state="error"] {
        color: #8c1d18;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Nexora ayarları</h1>
    <p>Eklenti yalnızca kategori dakikalarını gönderir; ham bağlantı toplanmaz.</p>
    <label for="apiBase">API adresi</label>
    <input id="apiBase" type="url" inputmode="url" placeholder="http://localhost:3000" />
    <p class="hint">Varsayılan: http://localhost:3000</p>
    <label for="token">Oturum anahtarı</label>
    <input id="token" type="password" autocomplete="off" />
    <p class="hint">
      Anahtarı almak için README.md içindeki tek satırlık <code>POST /auth/login</code> komutunu çalıştır ve dönen
      <code>token</code> değerini buraya yapıştır.
    </p>
    <button id="save" type="button">Kaydet</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
