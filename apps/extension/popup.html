<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora — kategori dakikaları</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <div class="trust-strip">Ham bağlantı toplanmaz; yalnızca kategori dakikaları.</div>
    <header class="brand-row">
      <h1 class="brand"><span class="mark" aria-hidden="true"></span>Nexora</h1>
      <a class="settings-link" href="options.html" target="_blank">Ayarlar <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <section class="hero" aria-labelledby="summary-hint">
        <div class="summary">
          <div><span id="total" class="total">—</span><span class="unit">dk</span></div>
          <span id="activity" class="pill">Hazırlanıyor</span>
        </div>
        <p class="hint" id="summary-hint">Bugünkü kategori toplamın</p>
      </section>
      <section class="category-card" aria-labelledby="category-title">
        <div class="section-heading"><h2 id="category-title">Kategori özeti</h2><span class="eyebrow">BUGÜN</span></div>
        <p id="status" role="status" aria-live="polite" data-state="loading">Yükleniyor…</p>
        <ul id="minutes" aria-label="Kategori dakikaları" hidden></ul>
      </section>
      <div class="actions">
        <button id="send" type="button">Şimdi gönder <span aria-hidden="true">→</span></button>
        <div class="controls">
          <button id="pause" type="button" class="secondary">Duraklat</button>
          <button id="clear" type="button" class="secondary">Temizle</button>
        </div>
      </div>
      <p id="last" class="hint sync-status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
