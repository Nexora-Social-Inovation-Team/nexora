<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Nexora — kategori dakikaları</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        width: 20rem;
        margin: 0;
        padding: 1rem;
        background: #ffffff;
        color: #14181f; /* 15.6:1 on white */
        font: 0.875rem/1.5 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      #status {
        margin: 0 0 0.75rem;
        color: #3b4451; /* 9.5:1 on white */
      }
      #status[data-state="error"] {
        color: #8c1d18; /* 7.6:1 on white */
        font-weight: 600;
      }
      ul {
        margin: 0 0 0.75rem;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.25rem 0;
        border-bottom: 1px solid #d5dae2;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      button {
        flex: 1 1 auto;
        padding: 0.5rem 0.75rem;
        border: 1px solid #1b4965;
        border-radius: 0.375rem;
        background: #1b4965; /* 9.3:1 with white text */
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        background: #ffffff;
        color: #1b4965;
      }
      button:focus-visible {
        outline: 3px solid #0b46c0;
        outline-offset: 2px;
      }
      .note {
        margin: 0.75rem 0 0;
        color: #3b4451;
      }
    </style>
  </head>
  <body>
    <h1>Nexora</h1>
    <p id="status" role="status" aria-live="polite" data-state="loading">Yükleniyor…</p>
    <ul id="minutes" aria-label="Kategori dakikaları" hidden></ul>
    <div class="controls">
      <button id="send" type="button">Özeti gönder</button>
      <button id="pause" type="button" class="secondary">Duraklat</button>
      <button id="clear" type="button" class="secondary">Temizle</button>
    </div>
    <p class="note">Ham bağlantı toplanmaz; yalnızca kategori dakikaları.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
